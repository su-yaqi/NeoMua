[project]
name = "neomua-operator-cli"
version = "0.1.0"
requires-python = ">=3.10,<4.0"
dependencies = [
  "httpx>=0.28,<1",
  "typer>=0.21,<1",
]

[project.scripts]
neomua = "operator_cli.cli:main"

[dependency-groups]
dev = ["pytest>=7.4,<8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["operator_cli"]
