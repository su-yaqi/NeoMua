[project]
name = "neomua-runtime-worker"
version = "0.1.0"
requires-python = ">=3.10,<4.0"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.12,<3",
  "neomua-workflow-runtime",
]

[project.optional-dependencies]
claude = ["claude-agent-sdk==0.2.110"]

[dependency-groups]
dev = ["pytest>=7.4,<8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
neomua-workflow-runtime = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["runtime_worker"]
