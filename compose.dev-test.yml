services:
  proxy:
    ports: !reset []

  adminer:
    ports: !reset []

  backend:
    ports: !reset []
    # E2E must use a stable application process, not the hot-reload command
    # inherited from compose.override.yml.
    command:
      - fastapi
      - run
      - app/main.py
    environment:
      BACKEND_CORS_ORIGINS: "http://localhost:5173"
      ENABLE_PRIVATE_TEST_API: "true"
      FRONTEND_HOST: "http://localhost:5173"
      COVERAGE_FAIL_UNDER: "${COVERAGE_FAIL_UNDER-0}"

  mailcatcher:
    ports: !reset []

  frontend:
    ports: !reset []

  model-gateway:
    ports: !reset []

  frontend-dev:
    ports: !reset []
