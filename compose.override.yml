services:

  # Local services are available on their ports, but also available on:
  # http://api.localhost.tiangolo.com: backend
  # http://dashboard.localhost.tiangolo.com: frontend
  # etc. To enable it, update .env, set:
  # DOMAIN=localhost.tiangolo.com
  proxy:
    image: traefik:3.6
    profiles: ["proxy"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${DEV_PROXY_HTTP_PORT?Run through make or scripts/dev-stack.sh}:80"
      - "${DEV_TRAEFIK_DASHBOARD_PORT?Run through make or scripts/dev-stack.sh}:8080"
    # Duplicate the command from compose.yml to add --api.insecure=true
    command:
      # Enable Docker in Traefik, so that it reads labels from Docker services
      - --providers.docker
      # Add a constraint to only use services with the label for this stack
      - --providers.docker.constraints=Label(`traefik.constraint-label`, `${TRAEFIK_CONSTRAINT_LABEL?Run through make or scripts/dev-stack.sh}`)
      # Do not expose all Docker services, only the ones explicitly exposed
      - --providers.docker.exposedbydefault=false
      # Create an entrypoint "http" listening on port 80
      - --entrypoints.http.address=:80
      # Create an entrypoint "https" listening on port 443
      - --entrypoints.https.address=:443
      # Enable the access log, with HTTP requests
      - --accesslog
      # Enable the Traefik log, for configurations and errors
      - --log
      # Enable debug logging for local development
      - --log.level=DEBUG
      # Enable the Dashboard and API
      - --api
      # Enable the Dashboard and API in insecure mode for local development
      - --api.insecure=true
    labels:
      # Enable Traefik for this service, to make it available in the public network
      - traefik.enable=true
      - traefik.constraint-label=${TRAEFIK_CONSTRAINT_LABEL?Run through make or scripts/dev-stack.sh}
      # Dummy https-redirect middleware that doesn't really redirect, only to
      # allow running it locally
      - traefik.http.middlewares.https-redirect.contenttype.autodetect=false
    networks:
      - traefik-public
      - default

  db:
    restart: "no"

  adminer:
    restart: "no"
    profiles: ["tools"]
    ports:
      - "${DEV_ADMINER_PORT?Run through make or scripts/dev-stack.sh}:8080"
    labels:
      - traefik.http.routers.${STACK_NAME?Variable not set}-adminer-https.tls.certresolver=

  backend:
    restart: "no"
    ports:
      - "${DEV_BACKEND_PORT?Run through make or scripts/dev-stack.sh}:8000"
    labels:
      - traefik.http.routers.${STACK_NAME?Variable not set}-backend-https.tls.certresolver=
    build:
      context: .
      dockerfile: backend/Dockerfile
    # command: sleep infinity  # Infinite loop to keep container alive doing nothing
    command:
      - fastapi
      - run
      - --reload
      - "app/main.py"
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app/backend
          ignore:
            - ./backend/.venv
            - .venv
        - path: ./backend/pyproject.toml
          action: rebuild
    # TODO: remove once coverage is done locally
    volumes:
      - ./backend/htmlcov:/app/backend/htmlcov
    environment:
      SMTP_HOST: "mailcatcher"
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      EMAILS_FROM_EMAIL: "noreply@example.com"
      MODEL_GATEWAY_PUBLIC_URL: "${MODEL_GATEWAY_PUBLIC_URL?Run through make or scripts/dev-stack.sh}"

  mailcatcher:
    image: schickling/mailcatcher
    profiles: ["tools", "test"]
    ports:
      - "${DEV_MAILCATCHER_PORT?Run through make or scripts/dev-stack.sh}:1080"
      - "${DEV_SMTP_PORT?Run through make or scripts/dev-stack.sh}:1025"

  frontend:
    restart: "no"
    image: "${DOCKER_IMAGE_FRONTEND?Run through make or scripts/dev-stack.sh}:${TAG-dev}"
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=${DEV_BACKEND_URL?Run through make or scripts/dev-stack.sh}
        - NODE_ENV=production
    ports:
      - "${DEV_FRONTEND_PORT?Run through make or scripts/dev-stack.sh}:80"
    labels:
      - traefik.http.routers.${STACK_NAME?Variable not set}-frontend-https.tls.certresolver=

  model-gateway:
    restart: "no"
    ports:
      - "${DEV_MODEL_GATEWAY_PORT?Run through make or scripts/dev-stack.sh}:8090"
    labels:
      - traefik.http.routers.${STACK_NAME?Variable not set}-model-gateway-https.tls.certresolver=

  runtime-worker:
    restart: "no"

  frontend-dev:
    restart: "no"
    profiles: ["dev-hot"]
    image: "${DEV_FRONTEND_DEV_IMAGE?Run through make or scripts/dev-stack.sh}"
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    working_dir: /app/frontend
    environment:
      - VITE_API_URL=${DEV_BACKEND_URL?Run through make or scripts/dev-stack.sh}
    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0
      - --port
      - "5173"
    volumes:
      - ./frontend:/app/frontend
      - ./workflow_apps:/app/workflow_apps:ro
      - frontend-dev-node-modules:/app/frontend/node_modules
    ports:
      - "${DEV_FRONTEND_PORT?Run through make or scripts/dev-stack.sh}:5173"

  playwright:
    profiles: ["test"]
    network_mode: "service:backend"
    build:
      context: .
      dockerfile: frontend/Dockerfile.playwright
      args:
        - VITE_API_URL=http://backend:8000
        - NODE_ENV=production
    ipc: host
    depends_on:
      backend:
        condition: service_healthy
      mailcatcher:
        condition: service_started
    env_file:
      - .env
    environment:
      - VITE_API_URL=http://localhost:8000
      - MAILCATCHER_HOST=http://mailcatcher:1080
      # For the reports when run locally
      - PLAYWRIGHT_HTML_HOST=0.0.0.0
      - CI=${CI}
    volumes:
      - ./frontend/blob-report:/app/frontend/blob-report
      - ./frontend/test-results:/app/frontend/test-results

networks:
  traefik-public:
    # For local dev, don't expect an external Traefik network
    external: false

volumes:
  frontend-dev-node-modules:
