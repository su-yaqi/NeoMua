name: Reusable Hygiene

on:
  workflow_call:
    inputs:
      full:
        required: true
        type: boolean
      base_sha:
        required: false
        type: string
      head_sha:
        required: false
        type: string

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.4"
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
      - name: Install Python workspace
        run: uv sync --all-packages
      - name: Set up Bun for full checks
        if: inputs.full
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - name: Install frontend workspace for full checks
        if: inputs.full
        run: bun install --frozen-lockfile
      - name: Run full repository checks
        if: inputs.full
        run: uv run prek run --all-files --show-diff-on-failure
      - name: Run low-risk hygiene checks on the changed range
        if: ${{ !inputs.full }}
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          test -n "$BASE_SHA"
          test -n "$HEAD_SHA"
          for hook in check-added-large-files check-toml check-yaml end-of-file-fixer trailing-whitespace; do
            uv run prek run "$hook" --from-ref "$BASE_SHA" --to-ref "$HEAD_SHA" --show-diff-on-failure
          done
