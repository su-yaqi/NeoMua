name: Reusable Playwright Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: "1/4"
            index: 1
            slot: 91
          - shard: "2/4"
            index: 2
            slot: 92
          - shard: "3/4"
            index: 3
            slot: 93
          - shard: "4/4"
            index: 4
            slot: 94
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Initialize local test environment
        run: make dev-init
      - name: Run Playwright shard
        run: >-
          make DEV_SLOT=${{ matrix.slot }} test-e2e
          ARGS="--fail-on-flaky-tests --trace=retain-on-failure --shard=${{ matrix.shard }}"
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: blob-report-${{ matrix.index }}
          path: frontend/blob-report
          include-hidden-files: true
          retention-days: 1

  report:
    needs: playwright
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Download blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: frontend/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge HTML report
        run: bunx playwright merge-reports --reporter html ./all-blob-reports
        working-directory: frontend
      - name: Upload HTML report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: html-report-attempt-${{ github.run_attempt }}
          path: frontend/playwright-report
          include-hidden-files: true
          retention-days: 30
