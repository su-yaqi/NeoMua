[tool.uv.workspace]
members = ["backend", "runtime_worker", "model_gateway", "node_runtime"]

[dependency-groups]
dev = [
    "zizmor>=1.23.1",
]

github-actions = [
    "smokeshow >=0.5.0",
]

[tool.mypy]
strict = true
exclude = ["(^|/)alembic/"]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.src]
exclude = ["backend/app/alembic/**"]
