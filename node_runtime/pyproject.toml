[project]
name = "neomua-node-runtime"
version = "0.1.0"
requires-python = ">=3.10,<4.0"
dependencies = [
  "cryptography>=44,<50",
  "httpx>=0.28,<1",
  "neomua-runtime-worker",
  "pydantic>=2.12,<3",
  "typer>=0.21,<1",
  "websockets>=15,<17",
]

[project.optional-dependencies]
service = ["neomua-runtime-worker[claude]"]

[project.scripts]
neomua-node = "node_runtime.cli:app"

[dependency-groups]
dev = ["pytest>=7.4,<8"]

[tool.uv.sources]
neomua-runtime-worker = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["node_runtime"]
